[package]
name = "bruniao"
version = "0.1.0"
edition = "2021"
authors = ["Bruniao Trading Team"]
description = "High-performance Polymarket trading infrastructure"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full", "tracing"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto for L1/L2 auth
ethers = { version = "2.0", features = ["rustls", "ws"] }
hex = "0.4"

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }

# Qdrant vector database
qdrant-client = "1.7"

# DragonflyDB/Redis - High-performance distributed cache
redis = { version = "0.24", features = ["tokio-comp", "connection-manager", "cluster-async"] }
deadpool-redis = "0.14"

# RabbitMQ - Async message broker
lapin = "2.3"
deadpool-lapin = "0.11"
async-trait = "0.1"

# Utils
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rust_decimal = { version = "1.33", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
config = "0.14"
dotenv = "0.15"
dashmap = "5.5"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Crypto for signing
hmac = "0.12"
sha2 = "0.10"

[[bin]]
name = "bruniao"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
