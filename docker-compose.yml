version: '3.8'

services:
  # Qdrant Vector Database for Bot Memory
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bruniao-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Trading Bot Core (Rust)
  trading-bot:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: bruniao-bot
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - bot_data:/var/lib/bruniao
    environment:
      - RUST_LOG=info
      - BRUNIAO_POLYMARKET__PRIVATE_KEY=${POLYMARKET_PRIVATE_KEY}
      - BRUNIAO_POLYMARKET__API_KEY=${POLYMARKET_API_KEY}
      - BRUNIAO_POLYMARKET__API_SECRET=${POLYMARKET_API_SECRET}
      - BRUNIAO_POLYMARKET__API_PASSPHRASE=${POLYMARKET_API_PASSPHRASE}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped
    command: ["--config", "/app/config/production.yaml"]

  # Web Dashboard (Next.js)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: bruniao-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://trading-bot:8080
    depends_on:
      - trading-bot
    restart: unless-stopped

  # Analysis Service (Python)
  analysis:
    build:
      context: ./analysis
      dockerfile: Dockerfile
    container_name: bruniao-analysis
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    environment:
      - QDRANT_URL=http://qdrant:6333
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    restart: unless-stopped

volumes:
  qdrant_data:
  bot_data:

networks:
  default:
    name: bruniao-network
