version: '3.8'

services:
  # DragonflyDB - High-Performance Redis-Compatible Cache (25x faster than Redis)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: bruniao-dragonfly
    ulimits:
      memlock: -1
    ports:
      - "6379:6379"
    volumes:
      - dragonfly_data:/data
    command: >
      --logtostderr
      --cache_mode=true
      --maxmemory=2gb
      --hz=100
      --tcp_keepalive=300
      --snapshot_cron="*/30 * * * *"
      --dbfilename=bruniao.rdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ - High-Performance Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: bruniao-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=bruniao
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-bruniao_secret}
      - RABBITMQ_DEFAULT_VHOST=trading
      - RABBITMQ_VM_MEMORY_HIGH_WATERMARK=0.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Qdrant Vector Database for Bot Memory
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bruniao-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Trading Bot Core (Rust)
  trading-bot:
    build:
      context: ./core
      dockerfile: Dockerfile
    container_name: bruniao-bot
    depends_on:
      qdrant:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - bot_data:/var/lib/bruniao
    environment:
      - RUST_LOG=info
      - BRUNIAO_POLYMARKET__PRIVATE_KEY=${POLYMARKET_PRIVATE_KEY}
      - BRUNIAO_POLYMARKET__API_KEY=${POLYMARKET_API_KEY}
      - BRUNIAO_POLYMARKET__API_SECRET=${POLYMARKET_API_SECRET}
      - BRUNIAO_POLYMARKET__API_PASSPHRASE=${POLYMARKET_API_PASSPHRASE}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DRAGONFLY_URL=redis://dragonfly:6379
      - RABBITMQ_URL=amqp://bruniao:${RABBITMQ_PASSWORD:-bruniao_secret}@rabbitmq:5672/trading
    restart: unless-stopped
    command: ["--config", "/app/config/production.yaml"]

  # Web Dashboard (Next.js)
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: bruniao-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://trading-bot:8080
    depends_on:
      - trading-bot
    restart: unless-stopped

  # Analysis Service (Python)
  analysis:
    build:
      context: ./analysis
      dockerfile: Dockerfile
    container_name: bruniao-analysis
    depends_on:
      qdrant:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    environment:
      - QDRANT_URL=http://qdrant:6333
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DRAGONFLY_URL=redis://dragonfly:6379
      - RABBITMQ_URL=amqp://bruniao:${RABBITMQ_PASSWORD:-bruniao_secret}@rabbitmq:5672/trading
    restart: unless-stopped

  # Debate Worker - Event-driven bot debate processing
  debate-worker:
    build:
      context: ./analysis
      dockerfile: Dockerfile
    container_name: bruniao-debate-worker
    command: ["python", "-m", "workers.debate_worker"]
    depends_on:
      qdrant:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
    environment:
      - QDRANT_URL=http://qdrant:6333
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DRAGONFLY_URL=redis://dragonfly:6379
      - RABBITMQ_URL=amqp://bruniao:${RABBITMQ_PASSWORD:-bruniao_secret}@rabbitmq:5672/trading
      - MAX_CONCURRENT_DEBATES=5
    restart: unless-stopped
    deploy:
      replicas: 2  # Scale debate workers horizontally

volumes:
  qdrant_data:
  bot_data:
  dragonfly_data:
  rabbitmq_data:

networks:
  default:
    name: bruniao-network
