[package]
name = "bruniao-memory"
version = "0.1.0"
edition = "2021"
description = "Bot memory storage using Qdrant vector database"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
qdrant-client = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.6", features = ["v4", "serde"] }
tokio = { version = "1.35", features = ["full"] }
