# Bruniao Trading Bot Configuration
# Environment: Production

# Polymarket API Configuration
polymarket:
  clob_url: "https://clob.polymarket.com"
  gamma_url: "https://gamma-api.polymarket.com"
  ws_url: "wss://clob.polymarket.com/ws"
  # CRITICAL: Set via environment variables
  # BRUNIAO_POLYMARKET__PRIVATE_KEY
  # BRUNIAO_POLYMARKET__API_KEY
  # BRUNIAO_POLYMARKET__API_SECRET
  # BRUNIAO_POLYMARKET__API_PASSPHRASE

# Risk Management - Production Settings
risk:
  max_position_per_market: 10.00
  max_open_positions: 5
  daily_drawdown_limit: 0.05
  min_book_size: 10.00  # Higher threshold for production
  kill_switch_enabled: true
  max_order_size: 5.00

# Strategy Configuration
strategy:
  loop_interval_ms: 50  # Faster loop for production
  mm_spread_ticks: 1
  mm_quote_size: 2.00
  inventory_skew_threshold: 0.5
  arb_threshold: 0.02
  markets: []

# Database
database:
  sqlite_path: "/var/lib/bruniao/bruniao.db"

# Qdrant
qdrant:
  url: "http://qdrant:6333"
  collection_name: "trading_decisions"
  vector_size: 1536

# LLM
llm:
  provider: "anthropic"
  model: "claude-3-haiku-20240307"
  max_tokens: 1024
  temperature: 0.0
  cache:
    enabled: true
    max_entries: 5000
    default_ttl_seconds: 3600

# Browser (Azul) - Disabled by default in production
# Enable for agents to research markets via web search
browser:
  enabled: false
  azul_path: "/usr/local/bin/azul"
  js_rendering: true
  ai_provider: "anthropic"
  default_search_engine: "duckduckgo"
  timeout_seconds: 30

# DragonflyDB - High-Performance Distributed Cache
dragonfly:
  url: "redis://dragonfly:6379"
  pool_size: 20
  prefix: "bruniao"
  cache_ttl:
    orderbook: 5
    market_data: 60
    position: 30
    prompt: 3600
    debate: 1800
    embedding: 86400

# RabbitMQ - Message Queue
rabbitmq:
  url: "amqp://bruniao:${RABBITMQ_PASSWORD}@rabbitmq:5672/trading"
  prefetch_count: 10
  exchanges:
    trading: "trading"
    signals: "signals"
    orders: "orders"
    risk: "risk"
    debates: "debates"
    events: "events"
  workers:
    debate:
      max_concurrent: 5
      max_rounds: 5

# Infrastructure Health Checks
health:
  enabled: true
  interval_seconds: 30
  services:
    - name: "dragonfly"
      type: "redis"
      url: "redis://dragonfly:6379"
    - name: "rabbitmq"
      type: "amqp"
      url: "amqp://bruniao:${RABBITMQ_PASSWORD}@rabbitmq:5672/trading"
    - name: "qdrant"
      type: "http"
      url: "http://qdrant:6333/health"
